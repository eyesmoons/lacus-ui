server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 静态资源压缩：配合构建产物中预生成的 .gz 文件（VITE_BUILD_COMPRESS=gzip）
    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不可长缓存，否则发布后用户拿到的是旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ @router;
    }

    location @router {
        rewrite ^.*$ /index.html last;
    }

    # 接口转发。注意前缀是 /lacus-api（后端 lacus-admin 监听 8090）
    location ~ ^/lacus-api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST       $remote_addr;

        rewrite ^/lacus-api/(.*)$ /$1 break;
        proxy_pass http://lacus-admin:8090;
    }
}
